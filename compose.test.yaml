name: chess-study-tests
services:
  test-db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: chess_test
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_DB: chess_test
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess_test -d chess_test"]
      interval: 2s
      timeout: 5s
      retries: 20
  tests:
    build:
      context: .
      target: test
    depends_on:
      test-db:
        condition: service_healthy
    environment:
      TEST_DATABASE_URL: postgresql://chess_test:test-only-password@test-db:5432/chess_test
      OPENAI_API_KEY: ""
      LANGSMITH_TRACING: "false"
